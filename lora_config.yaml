model: Qwen/Qwen3-1.7B-Base
train: true
data: data_aihuman
fine_tune_type: lora
optimizer: adamw
mask_prompt: true
num_layers: 16
batch_size: 4
iters: 54
val_batches: 8
learning_rate: 0.0001
steps_per_report: 10
steps_per_eval: 25
max_seq_length: 1024
adapter_path: adapters_aihuman
save_every: 50
grad_checkpoint: true
seed: 0
lora_parameters:
  rank: 32
  scale: 16.0
  dropout: 0.05
lr_schedule:
  name: cosine_decay
  arguments:
  - 0.0001
  - 54
  - 1.0e-05
  warmup: 5
